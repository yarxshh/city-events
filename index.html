<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <header>
        <h1>Афіша подій міста</h1>
        <nav>
            <ul>
                <li><a href="#event-section">Події</a></li>
                <li><a href="#sidebar">Обрана подія</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="filter-section">
            <h2>Фільтр за датою/категорією</h2>
            <label for="date-filter">Дата:</label>
            <input type="date" id="date-filter">
        </section>

        <section id="event-section">
            <h2>Список подій</h2>
            <article id="event">
                 <h3>Назва події</h3>
                 <img src="assets/img/images.jpg" alt="Опис зображення події">
                <p>Опис події</p>
            </article>
        </section>
    </main>

    
    <aside id="sidebar">
        <h2>Обрана подія</h2>
        <div id="selected-event">
            <!-- Тут буде відображатися обрана подія -->
        </div>
    </aside>
    
    <footer>
        <p>&copy; 2026 Афіша подій міста. Всі права захищені.</p>
        <p>Контактна інформація: example@example.com</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
