<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <header>
        <h1>Афіша подій міста</h1>
        <nav>
            <ul>
                <li><a href="#event-section">Події</a></li>
                <li><a href="#sidebar">Обрана подія</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
    <main>
        <section id="add-event-section">
        <h2>Додати нову подію</h2>
        <form id="add-event-form">
            <label for="event-title">Назва події:</label>
            
            <input type="text" id="event-title" name="title" required pattern=".{3,}">

            <label for="event-category">Категорія:</label>
            <select id="event-category" name="category" required>
                <option value="" disabled selected>Оберіть категорію</option>
                <option value="музика">Музика</option>
                <option value="театр">Театр</option>
                <option value="розваги">Розваги</option>
            </select>

            <label for="event-date">Дата:</label>
            <input type="date" id="event-date" name="date" required>

            <button type="submit">Додати</button>
        </form>
    </section>

        <section id="filter-section">
        <h2>Фільтр за категорією</h2>
        <div id="filter-buttons">
            <button data-filter="all">Всі події</button>
            <button data-filter="музика">Музика</button>
            <button data-filter="театр">Театр</button>
            <button data-filter="розваги">Розваги</button>
        </div>
    </section>

        <section id="event-section">
        <h2>Список подій</h2>
        
        <div class="cards-container" id="events-list"></div>
        <p id="events-count" style="font-weight: bold; margin-top: 20px;"></p>
    </section>
            
        </section>
    </main>

    
    <aside id="sidebar">
        <h2>Обрана подія</h2>
        <div id="selected-event">
            <!-- Тут буде відображатися обрана подія -->
        </div>
    </aside>
    </div>
    
    <footer>
        <p>&copy; 2026 Афіша подій міста. Всі права захищені.</p>
        <p>Контактна інформація: example@example.com</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
